    <script>
      // In AI Studio iFrame sandbox, WebSockets are disabled by design.
      // Safely mock Vite HMR WebSocket so @vite/client never throws 'WebSocket closed without opened'.
      (function() {
        if (typeof window === 'undefined') return;
        const NativeWebSocket = window.WebSocket;

        class ViteSafeWebSocket extends EventTarget {
          constructor(url, protocols) {
            super();
            this.url = url;
            this.protocols = protocols;
            this.readyState = 1; // WebSocket.OPEN
            this.CONNECTING = 0;
            this.OPEN = 1;
            this.CLOSING = 2;
            this.CLOSED = 3;
            this.bufferedAmount = 0;
            this.binaryType = 'blob';
            this.protocol = typeof protocols === 'string' ? protocols : '';
            setTimeout(() => {
              const openEvent = new Event('open');
              this.dispatchEvent(openEvent);
              if (typeof this.onopen === 'function') this.onopen(openEvent);
            }, 10);
          }
          send() {}
          close() {
            this.readyState = 3;
            const closeEvent = new Event('close');
            Object.defineProperty(closeEvent, 'wasClean', { value: true });
            this.dispatchEvent(closeEvent);
            if (typeof this.onclose === 'function') this.onclose(closeEvent);
          }
        }
        ViteSafeWebSocket.CONNECTING = 0;
        ViteSafeWebSocket.OPEN = 1;
        ViteSafeWebSocket.CLOSING = 2;
        ViteSafeWebSocket.CLOSED = 3;

        window.WebSocket = function(url, protocols) {
          if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite') || url.includes(window.location.host)))) {
            return new ViteSafeWebSocket(url, protocols);
          }
          if (NativeWebSocket) {
            try {
              return new NativeWebSocket(url, protocols);
            } catch (err) {
              return new ViteSafeWebSocket(url, protocols);
            }
          }
          return new ViteSafeWebSocket(url, protocols);
        };
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;
        window.WebSocket.prototype = ViteSafeWebSocket.prototype;

        // Catch and suppress any trailing unhandled WebSocket errors
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('vite') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && String(e.reason).indexOf('WebSocket') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
